<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilefall: daily tile puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--glass:.6;--bg:#f3f0fb;--panel:#fff;--ink:#1d1833;--mute:#6b6488;--line:#d9d3ee;--ok:#12a37f;--sel:#e0561f;--btn:#1d1833;--btnink:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122a;--panel:#211d3d;--ink:#f1ecff;--mute:#a69fc9;--line:#37315e;--ok:#6fe3c1;--sel:#ffb067;--btn:#f1ecff;--btnink:#15122a}}
:root[data-theme="dark"]{--bg:#15122a;--panel:#211d3d;--ink:#f1ecff;--mute:#a69fc9;--line:#37315e;--ok:#6fe3c1;--sel:#ffb067;--btn:#f1ecff;--btnink:#15122a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:540px;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.7rem;font-weight:800;margin:0;letter-spacing:-.02em}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
button.main{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#time{font-variant-numeric:tabular-nums;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
#grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;aspect-ratio:1;transition:gap .5s,padding .5s}
.tile{position:relative;isolation:isolate;border-radius:8px;background-size:400% 400%;border:0;padding:0;transition:border-radius .5s,transform .15s,scale .18s,box-shadow .18s;overflow:visible}
.tile.now{}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 55%,rgba(255,255,255,.2));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -8px 16px rgba(255,255,255,.08)}
.ld{font-weight:700;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.85rem;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld:focus-within{outline:3px solid var(--sel);outline-offset:2px}
.tile::before{transition:box-shadow .2s,border-color .2s;
 background:linear-gradient(145deg,rgba(255,255,255,calc(.14 + var(--glass)*.30)),rgba(255,255,255,calc(.03 + var(--glass)*.06)) 50%,rgba(255,255,255,calc(.10 + var(--glass)*.18)));
 -webkit-backdrop-filter:blur(calc(3px + var(--glass)*15px)) saturate(1.7);backdrop-filter:blur(calc(3px + var(--glass)*15px)) saturate(1.7);
 border:1px solid rgba(255,255,255,.4);
 box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -1.5px 1px rgba(255,255,255,.25),inset 0 0 14px rgba(255,255,255,.12),0 1px 6px rgba(0,0,0,.18)}
.tile.now::before{
 
 border-color:rgba(255,255,255,.95);box-shadow:inset 0 2px 2px #fff,inset 0 -2px 2px rgba(255,255,255,.5),inset 0 0 22px rgba(255,255,255,.55),0 0 18px rgba(255,255,255,.45)}
.glass{display:flex;align-items:center;gap:10px;margin:10px 4px 0;color:var(--mute);font-size:.85rem;font-weight:500}
.glass input{flex:1;accent-color:var(--ink)}
#q{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px}
.hint{margin:0 4px 10px;color:var(--mute);font-weight:500;font-size:.9rem;text-align:center;min-height:2.6em}
.img{position:absolute;inset:0;border-radius:inherit;background-size:400% 400%;filter:blur(11px) saturate(.85);pointer-events:none;transition:filter .6s}
#grid.done .img{filter:none}
#discs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:46vh;overflow:auto;padding:4px}
.disc{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:6px;color:var(--ink);border-radius:14px}
.disc b{font-size:.8rem}
.disc.done{opacity:.7}
.cv{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.cv i{position:absolute;inset:-14px;background-size:cover;background-position:center;filter:blur(6px) saturate(1);opacity:0;transition:opacity .6s}
.cv.on i{opacity:1}
.cv::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,.35),rgba(255,255,255,0) 25%,rgba(255,255,255,.3) 50%,rgba(255,255,255,0) 75%,rgba(255,255,255,.35))}
.kw{color:var(--mute);font-size:.68rem;line-height:1.25;text-align:center;max-width:96px}
.cd{position:relative;width:92px;height:92px;border-radius:50%;background:conic-gradient(from 20deg,#c9d6ff,#e6e6e6,#ffd3f6,#cdeaff,#e9e0ff,#c9d6ff);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.25);transition:transform .5s}
.cd::after{content:"";z-index:1;position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.hp{position:absolute;z-index:2;bottom:-4px;right:-4px;width:30px;height:30px;display:grid;place-items:center;font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:50%}
.disc:hover .cd,.disc:focus-visible .cd{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.cd,.img{transition:none}}
.tile.lock::after{content:"\1F512";position:absolute;top:4px;right:4px;font-size:.7rem;z-index:3;pointer-events:none}
.tile.sel{outline:3px solid var(--sel);outline-offset:-3px;filter:blur(4px) saturate(1.2);transform:scale(.95)}
.tile.ok::after{content:"\2713";position:absolute;inset:auto 4px 4px auto;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#111;font-weight:800;display:grid;place-items:center;font-size:.8rem;z-index:3;pointer-events:none}
.tile.ok{outline:3px solid var(--ok);outline-offset:-3px}
#grid.done{}
#grid.done .tile{filter:none;transform:none}
#grid.done .tile::before{display:none}
#grid.done{overflow:visible}
.clip{display:flex;align-items:center;gap:10px;margin:12px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.play{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center}
.wave{display:flex;align-items:center;gap:3px;flex:1;height:30px}
.wave i{flex:1;background:var(--mute);border-radius:2px;height:100%;transform:scaleY(.3);transform-origin:center;will-change:transform}
.playing .wave i{animation:b .5s ease-in-out infinite alternate}
@keyframes b{to{transform:scaleY(.95)}}
@media (prefers-reduced-motion:reduce){.playing .wave i{animation:none;transform:scaleY(.7)}.tile,#grid{transition:none}}
.row{display:flex;justify-content:space-between;gap:8px}
#msg{min-height:1.4em;text-align:center;color:var(--mute);margin:12px 0 0;font-weight:500}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);width:min(92vw,420px);max-height:80vh;padding:18px}
dialog::backdrop{background:#0008}
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats span{color:var(--mute);font-size:.8rem}
#list{list-style:none;margin:0;padding:0;overflow:auto;max-height:46vh}
#list li button{width:100%;display:flex;justify-content:space-between;border-radius:12px;margin-bottom:6px;font-weight:500}
.slot{border:1.5px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--ink) 5%,transparent);position:relative;min-width:0}
.slot .tile{position:absolute;inset:0;width:100%}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;margin-top:14px;min-height:96px;padding:6px 0}
#tray .tile{width:12.6%;aspect-ratio:1;margin:0 -.4%;box-shadow:0 4px 10px #0004;cursor:grab}
.tile{touch-action:none;user-select:none;-webkit-user-select:none}
.tile.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;box-shadow:0 12px 26px #0006;transform:none!important;scale:1.06;transition:none;will-change:translate}

.tile.ok{cursor:default}
#grid.done~#tray{display:none}
.mvbox{position:relative;margin-top:12px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.mvbox video,#mvf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) saturate(.9);transform:scale(1.15)}
#grid.done~.mvbox video,#grid.done~.mvbox #mvf{filter:none;transform:none}
#mvf{background-size:260%;background-position:50% 50%;transition:background-position 1.2s ease}
.mvbox.hasv #mvf{display:none}.mvbox:not(.hasv) video{display:none}
.mvbox:not(.live)::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.mvtag{position:absolute;left:10px;bottom:8px;z-index:2;color:#fff;font-size:.75rem;font-weight:700;text-shadow:0 1px 4px #000a}

.mvbox{position:fixed;left:0;top:0;width:4px;height:4px;margin:0;border:0;opacity:.01;overflow:hidden;pointer-events:none;z-index:-1}
.mvbox::after,.mvtag,#mvf{display:none!important}
.vc{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;filter:blur(7px) saturate(.95);pointer-events:none;transition:filter .6s}
#grid.done .vc{filter:none}

.ckw{display:flex;flex-direction:column;align-items:center;gap:4px}
.ckw small{color:var(--mute);font-weight:700;font-size:.78rem}
#time.pen{color:var(--sel);border-color:var(--sel)}
#mvst{color:var(--mute);font-weight:700;font-size:.75rem;white-space:nowrap}
</style>
</head>
<body>
<main>
 <header><h1>Tilefall</h1><span><button id="theme" aria-label="Toggle dark mode">Dark</button> <button id="archBtn">Archive</button></span></header>
 <div class="bar"><button id="dayBtn" aria-label="Open archive">Day #</button><small id="mvst"></small><span id="time">0:00</span></div>
 <div id="grid" aria-label="Puzzle grid"></div>
 <div id="tray" aria-label="Loose tiles"></div>
 <div class="mvbox" id="mvbox"><video id="mv" muted playsinline preload="auto"></video><div id="mvf"></div><span class="mvtag">🎬 Music video · syncs with each tile</span></div>
 <div class="clip" id="clip">
  <button class="play main" id="play" aria-label="Play clip">&#9654;</button>
  <div class="wave" id="wave"></div>
 </div>
 <p id="hint" class="hint"></p>
 <div class="row" style="margin-bottom:8px;display:none"><input id="q" type="search" value="A Friend of a Friend Azkal" aria-label="Search a song"><button id="go" class="main">Find song</button></div>
 <div class="row" style="margin-bottom:8px;display:none"><label class="ld">Load song<input type="file" id="song" accept="audio/*" hidden> <span id="songName"></span></label><label class="ld">Load cover<input type="file" id="cover" accept="image/*" hidden></label></div>
 <div class="row" style="align-items:flex-start"><div class="ckw"><button id="check" class="main">Check</button><small id="ckst">Checks 0/3</small></div><button id="results">See results</button><button id="again">Play again</button></div>
 <p id="msg" role="status">Tap a tile to hear its clip. Drag it into the grid to place it.</p>
</main>
<dialog id="dlg"><div id="dlgBody"></div><p style="text-align:right;margin:12px 0 0"><button id="close">Close</button></p></dialog>
<script>
// ====== CONTENT: replace puzzle() with your own images/audio ======
// Each puzzle needs an image (any URL or data URI) and a short sound clip (any audio URL).
// Here both are generated from the puzzle number so the page works with no files.
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(n,size){
 const r=rng(n*7919),c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d"),h=r()*360;
 let g=x.createLinearGradient(0,0,0,size);g.addColorStop(0,"hsl("+h+",70%,25%)");g.addColorStop(1,"hsl("+(h+60)+",85%,65%)");x.fillStyle=g;x.fillRect(0,0,size,size);
 x.fillStyle="hsl("+(h+160)+",95%,70%)";x.beginPath();x.arc(size*(.25+r()*.5),size*(.2+r()*.2),size*(.08+r()*.1),0,7);x.fill();
 for(let i=0;i<4;i++){x.fillStyle="hsla("+(h+i*25)+",60%,"+(18+i*9)+"%,.95)";x.beginPath();x.moveTo(0,size);
  const y0=size*(.5+i*.12);for(let k=0;k<=8;k++)x.lineTo(size*k/8,y0-r()*size*.2);x.lineTo(size,size);x.fill()}
 x.fillStyle="#fff";for(let i=0;i<14;i++){x.globalAlpha=.3+r()*.6;x.fillRect(r()*size,r()*size*.4,size*.008,size*.008)}
 x.globalAlpha=1;x.font="800 "+size*.12+"px sans-serif";x.fillStyle="#fff";x.textAlign="center";x.fillText("#"+n,size/2,size*.93);
 return c.toDataURL("image/jpeg",.92)}
let ac,mg=null;function playClip(n,done){
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();mg=ac.createGain();mg.connect(ac.destination);const r=rng(n*31),sc=[0,2,3,5,7,8,10],base=196*Math.pow(2,r()>.5?0:.5);
 let t=ac.currentTime+.05;for(let i=0;i<6;i++){const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";
  o.frequency.value=base*Math.pow(2,(sc[Math.floor(r()*7)]+(r()>.7?12:0))/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.27);
  o.connect(g).connect(mg);o.start(t);o.stop(t+.28);t+=.27}
 setTimeout(done,1700)}
// ====== GAME ======
const START=Date.UTC(2026,9,10),DAY=864e5,$=id=>document.getElementById(id);
const today=()=>{const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-START)/DAY)+1};
let num=((today()-1)%15)+1,slots=[],tray=[],marked=new Set(),solved=false,t0=0,tick=null,secs=0,img="",drag=null;
const LOCK=[0,15],MAXC=3;let checks=MAXC,penalty=0,ckT=0;
function ckUI(){const b=$("check");b.disabled=checks<=0;b.style.opacity=checks<=0?.5:1;b.style.cursor=checks<=0?"not-allowed":"pointer";$("ckst").textContent="Checks "+(MAXC-checks)+"/"+MAXC}
function tickPenalty(){secs=(t0?Math.floor((Date.now()-t0)/1000):0)+penalty;const t=$("time");t.textContent=fmt(secs);t.classList.add("pen");setTimeout(()=>t.classList.remove("pen"),900)}
function fadeMarks(){if(solved)return;if(drag){ckT=setTimeout(fadeMarks,400);return}marked.clear();render()}
function store(){try{return JSON.parse(localStorage.getItem("tilefall")||"{}")}catch(e){return{}}}
function save(o){try{localStorage.setItem("tilefall",JSON.stringify(o))}catch(e){}}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function dateOf(n){return new Date(START+(n-1)*DAY).toLocaleDateString("en",{month:"long",day:"numeric",timeZone:"UTC"})}
function load(n){
 num=n;stopAll();solved=false;secs=0;t0=0;checks=MAXC;penalty=0;clearTimeout(ckT);ckUI();clearInterval(tick);marked=new Set();$("time").textContent="0:00";
 img=toURL(art(n,512));hiImg="";buf=null;elAud=null;songFor(n);videoFor(n);const r=rng(n*104729),ids=[];for(let i=1;i<15;i++)ids.push(i);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 tray=ids;slots=Array(16).fill(null);slots[0]=0;slots[15]=15;
 $("grid").className="";$("dayBtn").textContent="Mystery disc "+n;$("hint").textContent=SONGS[n-1].era+" — "+SONGS[n-1].h;
 $("msg").textContent="Tap a tile to hear its clip. Drag it into the grid to place it.";render()}
function mk(id,bg){const d=document.createElement("div");d.className="tile";d.dataset.id=id;
 d.style.backgroundSize="0";const im=document.createElement("i");im.className="img";im.style.backgroundImage="url("+(bg||img)+")";im.style.backgroundPosition=(id%4)*33.333+"% "+Math.floor(id/4)*33.333+"%";d.appendChild(im);if(mvOK){const c=document.createElement("canvas");c.width=c.height=160;c.className="vc";c.dataset.id=id;d.appendChild(c)}return d}
function render(){
 const g=$("grid"),T=$("tray");g.innerHTML="";T.innerHTML="";$("mvf").style.backgroundImage="url("+img+")";
 slots.forEach((id,pos)=>{const s=document.createElement("div");s.className="slot";s.dataset.pos=pos;
  if(id!==null){const t=mk(id);if(LOCK.includes(pos))t.classList.add("lock");else if(marked.has(id)&&id===pos)t.classList.add("ok");
   if(!LOCK.includes(pos))t.onpointerdown=e=>start(e,t,"s",pos);else t.onclick=()=>tapTile(id);s.appendChild(t)}g.appendChild(s)});
 tray.forEach(id=>{const t=mk(id),r=rng(id*977+num);t.style.transform="rotate("+(r()*18-9).toFixed(1)+"deg) translateY("+(r()*8-4).toFixed(1)+"px)";
  t.onpointerdown=e=>start(e,t,"t",id);T.appendChild(t)});markNow()}
function start(e,el,from,ref){
 if(solved||drag)return;e.preventDefault();
 if(!t0){t0=Date.now();tick=setInterval(()=>{secs=Math.floor((Date.now()-t0)/1000)+penalty;$("time").textContent=fmt(secs)},250)}
 const w=$("grid").children[1].getBoundingClientRect().width;
 drag={el,from,ref,id:+el.dataset.id,w,x:e.clientX,y:e.clientY,moved:false};el.classList.add("drag");el.style.width=w+"px";el.style.height=w+"px";el.style.transform="";
 el.style.translate=(e.clientX-w/2)+"px "+(e.clientY-w/2)+"px";document.body.appendChild(el);move(e);
 addEventListener("pointermove",move);addEventListener("pointerup",end);addEventListener("pointercancel",end)}
function move(e){if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;drag.px=e.clientX;drag.py=e.clientY;
 if(!drag.raf)drag.raf=requestAnimationFrame(()=>{if(!drag)return;drag.raf=0;drag.el.style.translate=(drag.px-drag.w/2)+"px "+(drag.py-drag.w/2)+"px"})}
function end(e){
 removeEventListener("pointermove",move);removeEventListener("pointerup",end);removeEventListener("pointercancel",end);
 const d=drag;drag=null;d.el.remove();
 if(!d.moved){render();tapTile(d.id);return}
 const hit=document.elementFromPoint(e.clientX,e.clientY),slot=hit&&hit.closest&&hit.closest(".slot"),pos=slot?+slot.dataset.pos:-1;
 // take the tile out of where it came from
 if(d.from==="s")slots[d.ref]=null;else tray=tray.filter(i=>i!==d.id);
 marked.delete(d.id);
 if(pos>=0&&!LOCK.includes(pos)){
  const other=slots[pos];
  if(other!==null){marked.delete(other);if(d.from==="s")slots[d.ref]=other;else tray.push(other)}
  slots[pos]=d.id}
 else if(d.from==="s")tray.push(d.id);
 else tray.splice(Math.min(d.ref,tray.length),0,d.id);
 render();
 if(slots.every((id,p)=>id===p))win()}
function check(){
 if(solved||checks<=0)return;checks--;ckUI();penalty+=5;tickPenalty();clearTimeout(ckT);ckT=setTimeout(fadeMarks,5000);let n=0;
 slots.forEach((id,pos)=>{if(id!==null&&id===pos&&!LOCK.includes(pos)){marked.add(id);n++}});
 render();
 if(slots.every((id,p)=>id===p))win();
 else $("msg").textContent=(n?"Green ticks mark tiles in the right place and fade after 5 seconds.":"None of the placed tiles are in the right place yet.")+" "+(checks?checks+(checks>1?" checks":" check")+" left.":"No checks left.")+" (+5s added to your time)"}
function win(){
 solved=true;clearInterval(tick);if(mvOK){clearTimeout(vt);mvEl.loop=true;try{mvEl.currentTime=0}catch(e){}mvEl.play().catch(()=>{})}if(t0)secs=Math.floor((Date.now()-t0)/1000)+penalty;else secs=penalty;
 const hi=hiImg||toURL(art(num,1024));$("grid").className="done";
 [...$("grid").children].forEach((s,i)=>{s.innerHTML="";s.style.border="0";const wt=mk(i,hi);if(LOCK.includes(i))wt.classList.add("lock");wt.onclick=()=>tapTile(i);s.appendChild(wt)});
 $("grid").querySelectorAll(".tile").forEach(t=>t.style.filter="none");
 $("msg").textContent="Solved in "+fmt(secs)+" — it was “"+SONGS[num-1].t+"” by "+SONGS[num-1].a+".";
 const s=store();s.p=s.p||{};if(!s.p[num]||secs<s.p[num])s.p[num]=secs;save(s);setTimeout(()=>solvedPopup(num),1400)}
function nextUnsolved(){const p=store().p||{};for(let i=1;i<=SONGS.length;i++){const n=((num-1+i)%SONGS.length)+1;if(p[n]==null)return n}return null}
